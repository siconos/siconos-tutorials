variables:
  # Default ctest model. Warning : overwritten if set in schedules variables (as we expect)
  CTEST_BUILD_MODEL: Continuous
  # Default behavior regarding cdash submission
  CDASH_SUBMIT: 0
  # Name of the docker image used to run examples. Default = main.
  # Set by CI in siconos project for "triggered" examples.
  BUILD_EXAMPLES_DIR: ${CI_PROJECT_DIR}/build-examples
  # Default build path
  PARALLEL_BUILD: 1


# -- Template for examples build-test-install jobs --
# - Pull an image (possibly from siconos-tutorials registry)
#   named  IMAGE_NAME
.examples-build:
  image:
    name: $IMAGE_NAME
    entrypoint: [""]
  stage: test
  script:
    - env
    - sh ci_gitlab/build_and_run_examples.sh
  artifacts:
      paths:
        - build/
      expire_in: 3 days
      reports:
        junit: $CI_PROJECT_DIR/build-examples/test_results.xml

# examples, on a standard (default) Siconos installation
# (based on current siconos-tutorials branch --> it assumes that a branch of the same name exists in siconos repo)
run-examples:
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/siconoslab-$CI_COMMIT_REF_SLUG
    CDASH_SUBMIT: 1
    BUILD_EXAMPLES_DIR: ${CI_PROJECT_DIR}/build-examples
  extends: .examples-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "pipeline"' # no job when triggered by upstream
      when: never          # <-- ne crée pas le job dans ce cas
    - when: manual
      allow_failure: true

# Examples, executed on a "ready-to-use" image containing a
# full Siconos installation, based on the last version
# of a branch with the same name as the current example branch.
# - Run only when triggered from siconos project
# - Run on a docker image siconoslab-$CI_COMMIT_REF_SLUG
# $CI_COMMIT_REF_SLUG
# is the current branch name in lowercase
# This job runs in  multi-project pipelines only
# Required: same branch name in siconos and siconos-tutorials
triggered-examples:
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/siconoslab-$CI_COMMIT_REF_SLUG
    CDASH_SUBMIT: 1
    BUILD_EXAMPLES_DIR: ${CI_PROJECT_DIR}/build-examples
  extends: .examples-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
    - when: manual
      allow_failure: true

# examples, with a standard (default) Siconos installation
# with version from release 4.4 (latest)
# Triggered manualy.
run-examples:release:
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE/siconoslab-release-4.4
    CDASH_SUBMIT: 1
  extends: .examples-build
  when: manual
